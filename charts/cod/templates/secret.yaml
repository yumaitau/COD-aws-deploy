apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cod.fullname" . }}
  labels:
    {{- include "cod.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "databaseUrl is required (RDS PostgreSQL)" .Values.databaseUrl | quote }}
  REDIS_URL: {{ required "redisUrl is required (ElastiCache Redis / Valkey)" .Values.redisUrl | quote }}
  BETTER_AUTH_SECRET: {{ .Values.betterAuthSecret | default (randAlphaNum 48) | quote }}
  ENCRYPTION_MASTER_KEY: {{ .Values.encryptionMasterKey | default (randAlphaNum 48) | quote }}
  ALIGNR_SETUP_TOKEN: {{ .Values.setupToken | default (randAlphaNum 32) | quote }}
  ALIGNR_LICENSE_KEY: {{ .Values.licenseKey | quote }}
