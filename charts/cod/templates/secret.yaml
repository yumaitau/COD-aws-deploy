apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cod.fullname" . }}
  labels:
    {{- include "cod.labels" . | nindent 4 }}
type: Opaque
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cod.fullname" .) }}
{{- $auth := .Values.betterAuthSecret | default "" }}
{{- $enc := .Values.encryptionMasterKey | default "" }}
{{- $setup := .Values.setupToken | default "" }}
{{- $install := .Values.installId | default "" }}
{{- if $existing }}
{{- if and (not $auth) $existing.data }}{{ $auth = index $existing.data "BETTER_AUTH_SECRET" | default "" | b64dec }}{{ end }}
{{- if and (not $enc) $existing.data }}{{ $enc = index $existing.data "ENCRYPTION_MASTER_KEY" | default "" | b64dec }}{{ end }}
{{- if and (not $setup) $existing.data }}{{ $setup = index $existing.data "ALIGNR_SETUP_TOKEN" | default "" | b64dec }}{{ end }}
{{- if and (not $install) $existing.data }}{{ $install = index $existing.data "ALIGNR_INSTALL_ID" | default "" | b64dec }}{{ end }}
{{- end }}
stringData:
  DATABASE_URL: {{ required "databaseUrl is required (RDS PostgreSQL with sslmode=verify-full)" .Values.databaseUrl | quote }}
  REDIS_URL: {{ required "redisUrl is required (ElastiCache Redis / Valkey)" .Values.redisUrl | quote }}
  BETTER_AUTH_SECRET: {{ $auth | default (randAlphaNum 48) | quote }}
  ENCRYPTION_MASTER_KEY: {{ $enc | default (randAlphaNum 48) | quote }}
  ALIGNR_SETUP_TOKEN: {{ $setup | default (randAlphaNum 32) | quote }}
  ALIGNR_INSTALL_ID: {{ $install | default (randAlphaNum 24) | quote }}
  ALIGNR_LICENSE_KEY: {{ .Values.licenseKey | quote }}
