AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Buyer-hosted Compliance on Demand (COD) on ECS Fargate (AWS Marketplace container).
  Private subnets, internal ALB, digest-pinned image. Not internet-facing by default.

Parameters:
  ContainerImage:
    Type: String
    Description: Marketplace ECR digest (@sha256:...) or immutable tag (:1.0.N or :sha-<7>). latest is rejected.
    AllowedPattern: '^(?!.*:[Ll][Aa][Tt][Ee][Ss][Tt]).+(?:@sha256:[0-9a-f]{64}|:[0-9]+\.[0-9]+\.[0-9]+|:sha-[0-9a-f]{7}(?:-amd64|-arm64)?)$'
    ConstraintDescription: Image must be a digest or immutable tag. latest is not allowed.
  LicenseKey:
    Type: String
    NoEcho: true
    Description: Signed COD license JWT for this buyer deployment.
  NamePrefix:
    Type: String
    Default: cod
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  VpcCidr:
    Type: String
    Default: 10.80.0.0/16

Rules:
  AustraliaOnly:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref "AWS::Region", ap-southeast-2]
          - !Equals [!Ref "AWS::Region", ap-southeast-4]
        AssertDescription: Deploy this stack in Australia (ap-southeast-2 Sydney or ap-southeast-4 Melbourne).

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${NamePrefix}-vpc

  Igw:
    Type: AWS::EC2::InternetGateway

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${NamePrefix}-public-0

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${NamePrefix}-public-1

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${NamePrefix}-private-0

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${NamePrefix}-private-1

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  PublicAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: VPC CIDR to the internal ALB
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - Description: ALB to app tasks
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App and worker
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Internal ALB to app
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSg
      SecurityGroupEgress:
        - Description: NAT egress for cloud and SaaS API scans
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: App to PostgreSQL
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSg

  RedisSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: App to Redis
          IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref AppSg

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: COD
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DbPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${NamePrefix}/db-password
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true

  RedisAuth:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${NamePrefix}/redis-auth
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true

  DbParams:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Force SSL for COD Postgres
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${NamePrefix}-pg
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t4g.medium
      AllocatedStorage: 50
      DBName: cod
      MasterUsername: cod
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbPassword}:SecretString}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParams
      VPCSecurityGroups:
        - !Ref DbSg
      StorageEncrypted: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Compliance on Demand Redis
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Redis:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub ${NamePrefix}-redis
      ReplicationGroupDescription: Compliance on Demand Redis
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: cache.t4g.small
      NumCacheClusters: 1
      Port: 6379
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSg
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      SnapshotRetentionLimit: 7
      SnapshotWindow: "16:00-17:00"
      AuthToken: !Sub "{{resolve:secretsmanager:${RedisAuth}:SecretString}}"

  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  SetupToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  EncryptionKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 44
        ExcludePunctuation: true

  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DependsOn:
      - Database
      - Redis
    Properties:
      Name: !Sub ${NamePrefix}/runtime
      SecretString: !Sub
        - '{"DATABASE_URL":"postgresql://cod:${DbPass}@${DbHost}:5432/cod?schema=public&sslmode=verify-full","REDIS_URL":"rediss://:${RedisPass}@${RedisHost}:6379","BETTER_AUTH_SECRET":"${Auth}","ENCRYPTION_MASTER_KEY":"${Enc}","ALIGNR_SETUP_TOKEN":"${Setup}","ALIGNR_INSTALL_ID":"${Install}","ALIGNR_LICENSE_KEY":"${License}"}'
        - DbPass: !Sub "{{resolve:secretsmanager:${DbPassword}:SecretString}}"
          RedisPass: !Sub "{{resolve:secretsmanager:${RedisAuth}:SecretString}}"
          Auth: !Sub "{{resolve:secretsmanager:${AuthSecret}:SecretString}}"
          Enc: !Sub "{{resolve:secretsmanager:${EncryptionKey}:SecretString}}"
          Setup: !Sub "{{resolve:secretsmanager:${SetupToken}:SecretString}}"
          DbHost: !GetAtt Database.Endpoint.Address
          RedisHost: !GetAtt Redis.PrimaryEndPoint.Address
          Install: !Ref AWS::StackName
          License: !Ref LicenseKey

  SbomCliBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${NamePrefix}-${AWS::AccountId}-sbom-cli
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SbomCliBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SbomCliBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SbomCliBucket.Arn
              - !Sub ${SbomCliBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: SbomCliPublicGet
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${SbomCliBucket.Arn}/sbom-cli/*

  EfsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS from COD tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: App and worker to EFS
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AppSg

  DataFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub ${NamePrefix}-data
      BackupPolicy:
        Status: ENABLED

  DataMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref DataFileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !Ref EfsSg

  DataMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref DataFileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref EfsSg

  DataAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref DataFileSystem
      PosixUser:
        Uid: "1001"
        Gid: "1001"
      RootDirectory:
        Path: /alignr
        CreationInfo:
          OwnerUid: "1001"
          OwnerGid: "1001"
          Permissions: "0755"

  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${NamePrefix}-${AWS::AccountId}-backups
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcsExec
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
        - PolicyName: sbom-cli
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SbomCliGet
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt SbomCliBucket.Arn
                  - !Sub ${SbomCliBucket.Arn}/sbom-cli/*
        - PolicyName: storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EfsClient
                Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt DataFileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !GetAtt DataAccessPoint.Arn
              - Sid: BackupBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BackupBucket.Arn
                  - !Sub ${BackupBucket.Arn}/*
        - PolicyName: marketplace-license
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AwsMarketplaceLicense
                Effect: Allow
                Action:
                  - license-manager:CheckoutLicense
                  - license-manager:GetLicense
                  - license-manager:CheckInLicense
                  - license-manager:ExtendLicenseConsumption
                  - license-manager:ListReceivedLicenses
                Resource: "*"

  LogGroupApp:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${NamePrefix}/app
      RetentionInDays: 30

  LogGroupWorker:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${NamePrefix}/worker
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref NamePrefix
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${NamePrefix}-alb
      Scheme: internal
      Type: application
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref AlbSg

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${NamePrefix}-app
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref Vpc
      TargetType: ip
      HealthCheckPath: /api/health?probe=live
      Matcher:
        HttpCode: 200

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  AppTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${NamePrefix}-app
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      Volumes:
        - Name: app-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref DataFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref DataAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          Command: ["node", "server.js"]
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: HOSTNAME
              Value: "0.0.0.0"
            - Name: PORT
              Value: "3000"
            - Name: ALIGNR_DOMAIN
              Value: !GetAtt Alb.DNSName
            - Name: BETTER_AUTH_URL
              Value: !Sub http://${Alb.DNSName}
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AI_PROVIDER
              Value: disabled
            - Name: SBOM_CLI_S3_BUCKET
              Value: !Ref SbomCliBucket
            - Name: SBOM_CLI_DOWNLOAD_BASE
              Value: !Sub https://${SbomCliBucket}.s3.${AWS::Region}.amazonaws.com
            - Name: SECURITY_DOCUMENT_STORAGE_DIR
              Value: /app/data/security-documents
            - Name: ASSESSOR_PACK_STORAGE_DIR
              Value: /app/data/assessor-packs
            - Name: BRANDING_ASSET_STORAGE_DIR
              Value: /app/data/branding-assets
            - Name: ALIGNR_BACKUP_DESTINATION
              Value: !Sub s3://${BackupBucket}/nightly
            - Name: ALIGNR_HOST_SCANS_ENABLED
              Value: "true"
            - Name: ALIGNR_LOG_SERVICE
              Value: cod-app
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Sub "${RuntimeSecret}:DATABASE_URL::"
            - Name: REDIS_URL
              ValueFrom: !Sub "${RuntimeSecret}:REDIS_URL::"
            - Name: BETTER_AUTH_SECRET
              ValueFrom: !Sub "${RuntimeSecret}:BETTER_AUTH_SECRET::"
            - Name: ENCRYPTION_MASTER_KEY
              ValueFrom: !Sub "${RuntimeSecret}:ENCRYPTION_MASTER_KEY::"
            - Name: ALIGNR_SETUP_TOKEN
              ValueFrom: !Sub "${RuntimeSecret}:ALIGNR_SETUP_TOKEN::"
            - Name: ALIGNR_INSTALL_ID
              ValueFrom: !Sub "${RuntimeSecret}:ALIGNR_INSTALL_ID::"
            - Name: ALIGNR_LICENSE_KEY
              ValueFrom: !Sub "${RuntimeSecret}:ALIGNR_LICENSE_KEY::"
          MountPoints:
            - SourceVolume: app-data
              ContainerPath: /app/data
              ReadOnly: false
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'node -e "fetch(''http://127.0.0.1:3000/api/health?probe=live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 180
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupApp
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${NamePrefix}-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      Volumes:
        - Name: app-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref DataFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref DataAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ContainerImage
          Essential: true
          Command: ["node", "dist/worker-main.js"]
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: ALIGNR_DOMAIN
              Value: !GetAtt Alb.DNSName
            - Name: BETTER_AUTH_URL
              Value: !Sub http://${Alb.DNSName}
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AI_PROVIDER
              Value: disabled
            - Name: SBOM_CLI_S3_BUCKET
              Value: !Ref SbomCliBucket
            - Name: SBOM_CLI_DOWNLOAD_BASE
              Value: !Sub https://${SbomCliBucket}.s3.${AWS::Region}.amazonaws.com
            - Name: SECURITY_DOCUMENT_STORAGE_DIR
              Value: /app/data/security-documents
            - Name: ASSESSOR_PACK_STORAGE_DIR
              Value: /app/data/assessor-packs
            - Name: BRANDING_ASSET_STORAGE_DIR
              Value: /app/data/branding-assets
            - Name: ALIGNR_BACKUP_DESTINATION
              Value: !Sub s3://${BackupBucket}/nightly
            - Name: ALIGNR_HOST_SCANS_ENABLED
              Value: "true"
            - Name: ALIGNR_LOG_SERVICE
              Value: cod-worker
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Sub "${RuntimeSecret}:DATABASE_URL::"
            - Name: REDIS_URL
              ValueFrom: !Sub "${RuntimeSecret}:REDIS_URL::"
            - Name: BETTER_AUTH_SECRET
              ValueFrom: !Sub "${RuntimeSecret}:BETTER_AUTH_SECRET::"
            - Name: ENCRYPTION_MASTER_KEY
              ValueFrom: !Sub "${RuntimeSecret}:ENCRYPTION_MASTER_KEY::"
            - Name: ALIGNR_SETUP_TOKEN
              ValueFrom: !Sub "${RuntimeSecret}:ALIGNR_SETUP_TOKEN::"
            - Name: ALIGNR_INSTALL_ID
              ValueFrom: !Sub "${RuntimeSecret}:ALIGNR_INSTALL_ID::"
            - Name: ALIGNR_LICENSE_KEY
              ValueFrom: !Sub "${RuntimeSecret}:ALIGNR_LICENSE_KEY::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupWorker
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          MountPoints:
            - SourceVolume: app-data
              ContainerPath: /app/data
              ReadOnly: false

  AppService:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
      - DataMountTarget1
      - DataMountTarget2
    Properties:
      ServiceName: !Sub ${NamePrefix}-app
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AppTask
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref AppSg
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn:
      - DataMountTarget1
      - DataMountTarget2
    Properties:
      ServiceName: !Sub ${NamePrefix}-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTask
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref AppSg
          AssignPublicIp: DISABLED

Outputs:
  InternalAlbDnsName:
    Value: !GetAtt Alb.DNSName
  SetupUrl:
    Value: !Sub http://${Alb.DNSName}/setup
  RuntimeSecretArn:
    Value: !Ref RuntimeSecret
  UnsubscribeNote:
    Value: Unsubscribe = delete this stack. Data stays in the buyer account.
  AccessNote:
    Value: This stack is VPC-internal. Reach /setup from a VPN or SSM port-forward. It is not published to the internet.
  SbomCliBucket:
    Description: Upload signed binaries to s3://<this>/sbom-cli/ (cod-sbom-darwin-arm64, …).
    Value: !Ref SbomCliBucket
  BackupBucket:
    Description: Nightly backups go to s3://<this>/nightly when ALIGNR_BACKUP_DESTINATION is set.
    Value: !Ref BackupBucket
